repository_type: pipeline

nf_core_version: 4.2.1

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-taxbencher_logo_light.png
    - docs/images/nf-core-taxbencher_logo_light.png
    - docs/images/nf-core-taxbencher_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-taxbencher_logo_light.png
    - docs/images/nf-core-taxbencher_logo_light.png
    - docs/images/nf-core-taxbencher_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: FOI-Bioinformatics
  name: taxbencher
  description: Benchmark taxonomic classifiers using standardized metrics and CAMI
    OPAL evaluation
  author: "Andreas Sj\xF6din"
  version: 1.3.0dev
  force: true
  outdir: /tmp/claude-0/-home-user-taxbencher/e38da375-8d5b-592d-876a-b3e6a4602f40/scratchpad/template/taxbencher
  skip_features:
    - igenomes
    - seqera_platform
    - fastqc
  is_nfcore: false
