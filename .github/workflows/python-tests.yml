name: Python script unit tests
# Unit tests for the scientific core in bin/ (CAMI conversion, gold standard
# validation/repair, cross-sample summary). They run without Nextflow against
# the reduced, pinned taxonomy in assets/test_data/taxonomy.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.0" "ete3>=3.1.3" "six" "numpy" pytest

      - name: Run unit tests
        run: pytest -v tests/python
