      build_id: bd-afa623fee18ad8e0_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/python_pandas_scikit-learn_plotly_pruned:24c8063ae8d7b157
      build_id: bd-24c8063ae8d7b157_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/e0/e04b00d88399791cdd132f05867b1ade1dc3966a71153eb0f40b60c0185d7e7d/data
