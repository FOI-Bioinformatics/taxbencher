# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "taxpasta_to_bioboxes"
description: Convert a taxpasta standardised profile to the CAMI profiling (Bioboxes) format for OPAL
keywords:
  - format conversion
  - taxonomic profiling
  - CAMI
  - Bioboxes
  - taxpasta
tools:
  - "taxpasta_to_bioboxes":
      description: |
        Pipeline script (bin/taxpasta_to_bioboxes.py) producing proper CAMI profiles: abundances are
        cumulative per clade and sum to <= 100 % within every rank, TAXPATH holds one taxonomy ID per rank of
        @Ranks. Direct read counts (Kraken2, Centrifuge, Kaiju, ...) are summed over descendants; MetaPhlAn
        clade abundances are used as they are (mode chosen from meta.classifier). Lineages come from taxpasta
        lineage columns when present, otherwise from ete3 with the database built by ETE3_BUILD_TAXDB.
        Container: frozen Seqera Wave community image built from environment.yml
        (community.wave.seqera.io/library/python_pandas_ete3:0aabbd50f04018cb).
      homepage: https://github.com/FOI-Bioinformatics/taxbencher
      documentation: https://github.com/FOI-Bioinformatics/taxbencher/blob/main/docs/raw-inputs.md
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information and conversion options
          e.g. `[ id:'sample1_kraken2', sample_id:'sample1', classifier:'kraken2', taxonomy_db:'NCBI' ]`
          - id: profile identifier (required)
          - sample_id: @SampleID written to the profile (optional, defaults to id)
          - classifier: profiler name; 'metaphlan' selects the clade abundance mode (optional)
          - abundance_mode: 'direct' or 'clade', overrides the classifier based default (optional)
          - taxonomy_db: NCBI or GTDB (optional, default NCBI)
          - ranks: pipe-separated ranks (optional, default superkingdom|phylum|class|order|family|genus|species|strain)
    - taxpasta_tsv:
        type: file
        description: Taxpasta standardised TSV file with taxonomy_id and count columns (optionally lineage columns)
        pattern: "*.{tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  - taxdb:
      type: file
      description: |
        Optional ete3 taxonomy database files (taxa.sqlite and taxa.sqlite.traverse.pkl) built by
        ETE3_BUILD_TAXDB from a pinned taxdump. Pass [] when the input carries taxpasta lineage columns.
      pattern: "taxa.sqlite*"
      ontologies:
        - edam: http://edamontology.org/format_3621 # SQLite
output:
  bioboxes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information and conversion options
            e.g. `[ id:'sample1_kraken2', sample_id:'sample1', classifier:'kraken2', taxonomy_db:'NCBI' ]`
            - id: profile identifier (required)
            - sample_id: @SampleID written to the profile (optional, defaults to id)
            - classifier: profiler name; 'metaphlan' selects the clade abundance mode (optional)
            - abundance_mode: 'direct' or 'clade', overrides the classifier based default (optional)
            - taxonomy_db: NCBI or GTDB (optional, default NCBI)
            - ranks: pipe-separated ranks (optional, default superkingdom|phylum|class|order|family|genus|species|strain)
      - "*.bioboxes":
          type: file
          description: CAMI profiling (Bioboxes) file with @SampleID/@Version/@Ranks headers and TAXID, RANK, TAXPATH, TAXPATHSN, PERCENTAGE columns
          pattern: "*.bioboxes"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - python -c "import pandas; print(pandas.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_ete3:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ete3:
          type: string
          description: The name of the tool
      - python -c "import ete3; print(ete3.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_taxpasta_to_bioboxes:
    - - ${task.process}:
          type: string
          description: The name of the process
      - taxpasta_to_bioboxes:
          type: string
          description: The name of the tool
      - taxpasta_to_bioboxes.py --version | sed "s/taxpasta_to_bioboxes.py //":
          type: eval
          description: The expression to obtain the version of the tool
