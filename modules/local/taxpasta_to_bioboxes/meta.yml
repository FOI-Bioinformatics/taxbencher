# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "taxpasta_to_bioboxes"
description: Convert a taxpasta standardised profile to the CAMI profiling (Bioboxes) format for OPAL
keywords:
  - format conversion
  - taxonomic profiling
  - CAMI
  - Bioboxes
  - taxpasta
tools:
  - "taxpasta_to_bioboxes":
      description: |
        Pipeline script (bin/taxpasta_to_bioboxes.py) producing proper CAMI profiles: abundances are
        cumulative per clade and sum to <= 100 % within every rank, TAXPATH holds one taxonomy ID per rank of
        @Ranks. Direct read counts (Kraken2, Centrifuge, Kaiju, ...) are summed over descendants; MetaPhlAn
        clade abundances are used as they are (mode chosen from meta.classifier). Lineages come from taxpasta
        lineage columns when present, otherwise from the NCBI taxdump prepared by PREPARE_TAXDUMP (via taxopy;
        merged taxonomy IDs are translated to their current ID). Runs in the taxpasta biocontainer.
      homepage: https://github.com/FOI-Bioinformatics/taxbencher
      documentation: https://github.com/FOI-Bioinformatics/taxbencher/blob/main/docs/raw-inputs.md
      licence: ["MIT"]
      identifier: ""
  - "taxopy":
      description: A Python package for obtaining complete lineages and the lowest common ancestor from taxonomy IDs
      homepage: https://github.com/apcamargo/taxopy
      documentation: https://apcamargo.github.io/taxopy/
      licence: ["GPL-3.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information and conversion options
          e.g. `[ id:'sample1_kraken2', sample_id:'sample1', classifier:'kraken2', taxonomy_db:'NCBI' ]`
          - id: profile identifier (required)
          - sample_id: @SampleID written to the profile (optional, defaults to id)
          - classifier: profiler name; names starting with 'metaphlan' select the clade abundance mode (optional)
          - abundance_mode: 'direct' or 'clade', overrides the classifier based default (optional)
          - taxonomy_db: NCBI or GTDB (optional, default NCBI)
          - ranks: pipe-separated ranks (optional, default superkingdom|phylum|class|order|family|genus|species|strain)
    - taxpasta_tsv:
        type: file
        description: Taxpasta standardised TSV file with taxonomy_id and count columns (optionally lineage columns)
        pattern: "*.{tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  - taxdump:
      type: directory
      description: |
        Optional NCBI taxdump directory (nodes.dmp, names.dmp, merged.dmp) prepared by PREPARE_TAXDUMP
        from a pinned taxdump archive. Pass [] when the input carries taxpasta lineage columns (without
        either, the current NCBI taxdump is downloaded at run time).
      pattern: "taxdump"
output:
  bioboxes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information and conversion options
            e.g. `[ id:'sample1_kraken2', sample_id:'sample1', classifier:'kraken2', taxonomy_db:'NCBI' ]`
            - id: profile identifier (required)
            - sample_id: @SampleID written to the profile (optional, defaults to id)
            - classifier: profiler name; names starting with 'metaphlan' select the clade abundance mode (optional)
            - abundance_mode: 'direct' or 'clade', overrides the classifier based default (optional)
            - taxonomy_db: NCBI or GTDB (optional, default NCBI)
            - ranks: pipe-separated ranks (optional, default superkingdom|phylum|class|order|family|genus|species|strain)
      - "*.bioboxes":
          type: file
          description: CAMI profiling (Bioboxes) file with @SampleID/@Version/@Ranks headers and TAXID, RANK, TAXPATH, TAXPATHSN, PERCENTAGE columns
          pattern: "*.bioboxes"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - python -c "import pandas; print(pandas.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_taxopy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - taxopy:
          type: string
          description: The name of the tool
      - python -c "import taxopy; print(taxopy.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_taxpasta_to_bioboxes:
    - - ${task.process}:
          type: string
          description: The name of the process
      - taxpasta_to_bioboxes:
          type: string
          description: The name of the tool
      - taxpasta_to_bioboxes.py --version | sed "s/taxpasta_to_bioboxes.py //":
          type: eval
          description: The expression to obtain the version of the tool
