name: taxpasta_to_bioboxes
description: Convert taxpasta standardized format to CAMI Bioboxes profiling format
keywords:
  - format conversion
  - taxonomic profiling
  - CAMI
  - Bioboxes
  - taxpasta
  - standardization
tools:
  - custom:
      description: |
        Custom Python script to convert taxpasta standardized taxonomic profiling
        format to CAMI Bioboxes profiling format for use with OPAL evaluation tool.
        Produces proper CAMI profiles: abundances are cumulative per clade and sum to
        <= 100% within every rank, TAXPATH holds one taxonomy ID per rank of @Ranks.
        Direct read counts (Kraken2, Centrifuge, Kaiju, ...) are summed over descendants;
        MetaPhlAn clade abundances are used as they are (abundance mode chosen from
        meta.classifier). Lineages come from taxpasta lineage columns when present,
        otherwise from ete3 (pinned taxdump via ETE3_BUILD_TAXDB or ete3 default database).

        Container: frozen Seqera Wave community image built from environment.yml
        (community.wave.seqera.io/library/python_pandas_ete3:0aabbd50f04018cb; python 3.11, pandas, ete3).
        Conda profile uses environment.yml directly.
      homepage: https://github.com/nf-core/taxbencher
      documentation: https://github.com/nf-core/taxbencher
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information and optional parameters:
        - id: Sample identifier (required)
        - sample_id: Alternative sample identifier for output (optional, defaults to id)
        - ranks: Pipe-separated taxonomic ranks (optional, default: superkingdom|phylum|class|order|family|genus|species|strain)
        - taxonomy_db: Taxonomy database name (optional, default: NCBI)
        - classifier: Profiler name; 'metaphlan' selects clade abundance mode (optional)
        - abundance_mode: 'direct' or 'clade', overrides the classifier based default (optional)
  - taxpasta_tsv:
      type: file
      description: |
        Taxpasta standardized TSV file containing taxonomy_id and count columns.
        Format example:
        taxonomy_id    count
        562            1000
        1280           500
      pattern: "*.{tsv,txt}"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - taxdb:
      type: file
      description: |
        Optional ete3 taxonomy database files (taxa.sqlite and taxa.sqlite.traverse.pkl) built by
        ETE3_BUILD_TAXDB from a pinned taxdump. Pass [] to use the ete3 default database (downloaded
        from NCBI on first use) or when the input carries taxpasta lineage columns.
      pattern: "taxa.sqlite*"

output:
  - meta:
      type: map
      description: Groovy Map containing sample information (same as input meta)
  - bioboxes:
      type: file
      description: |
        CAMI Bioboxes profiling format file with metadata headers and taxonomic
        lineage information. Includes TAXID, RANK, TAXPATH, TAXPATHSN, and PERCENTAGE.
      pattern: "*.bioboxes"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
      ontologies:
        - edam: http://edamontology.org/format_3750 # YAML

authors:
  - "@taxbencher"
maintainers:
  - "@taxbencher"
