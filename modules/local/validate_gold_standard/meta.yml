name: "validate_gold_standard"
description: Validate the gold standard CAMI profiling (Bioboxes) file before OPAL evaluation
keywords:
  - validation
  - CAMI
  - Bioboxes
  - gold standard
tools:
  - validate_bioboxes:
      description: |
        Pipeline script (bin/validate_bioboxes.py) checking required headers, column layout,
        OPAL-supported ranks, TAXPATH structure, per-rank abundance sums and the presence of a
        @SampleID block for every sample of the samplesheet. Fails on errors (--strict).
      homepage: https://github.com/FOI-Bioinformatics/taxbencher
      documentation: https://github.com/FOI-Bioinformatics/taxbencher/blob/main/docs/troubleshooting-gold-standard.md
      licence: ["MIT"]

input:
  - gold_standard:
      type: file
      description: Gold standard in CAMI profiling Bioboxes format (one or more @SampleID blocks)
      pattern: "*.bioboxes"
  - sample_ids:
      type: list
      description: Sample IDs from the samplesheet that must have a matching @SampleID block

output:
  - gold_standard:
      type: file
      description: The validated gold standard file (unchanged), to make downstream processes depend on validation
      pattern: "*.bioboxes"
  - report:
      type: file
      description: Validator output with per-sample, per-rank statistics and warnings
      pattern: "*_validation.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
