name: "comparative_analysis"
description: Perform comparative analysis of taxonomic classifiers within a biological sample
keywords:
  - metagenomics
  - taxonomic profiling
  - benchmarking
  - comparative analysis
  - PCA
  - differential abundance
tools:
  - python:
      description: |
        Python programming language with scientific computing stack for
        statistical analysis and visualization of classifier performance metrics.

        Container: frozen Seqera Wave community image built from environment.yml
        (community.wave.seqera.io/library/python_pandas_scikit-learn_plotly_pruned:afa623fee18ad8e0;
        python 3.11, pandas, scikit-learn, plotly, scipy, statsmodels, numpy, python-kaleido).
        Conda profile uses environment.yml directly.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1', sample_id:'sample1', labels:'sample1_kraken2,sample1_metaphlan', num_classifiers:2 ]`
  - opal_dir:
      type: directory
      description: OPAL results directory containing results.tsv (long format) and evaluation data
      pattern: "*/"
  - bioboxes:
      type: file
      description: CAMI profiles of the evaluated classifiers, in the same order as meta.labels (optional, [] to skip per-taxon comparison)
      pattern: "*.bioboxes"
  - gold_standard:
      type: file
      description: Gold standard bioboxes file for differential analysis
      pattern: "*.bioboxes"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
  - pca_plot:
      type: file
      description: HTML file with PCA visualization of classifier performance metrics
      pattern: "*_pca.html"
  - diff_taxa:
      type: file
      description: TSV with per-taxon observed vs expected abundance, absolute/log2 difference and TP/FP/FN status per classifier and rank
      pattern: "*_diff_taxa.tsv"
  - metrics_wide:
      type: file
      description: OPAL metrics pivoted to one row per tool and rank
      pattern: "*_metrics_wide.tsv"
  - multiqc:
      type: file
      description: MultiQC custom content table with key OPAL metrics per classifier
      pattern: "*_mqc.tsv"
  - comparison_report:
      type: file
      description: HTML report with comprehensive classifier comparison
      pattern: "*_comparison.html"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
