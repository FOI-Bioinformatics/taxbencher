# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "comparative_analysis"
description: Compare the taxonomic classifiers evaluated within one biological sample (OPAL metrics, PCA, per-taxon observed vs expected abundance, MultiQC table)
keywords:
  - metagenomics
  - taxonomic profiling
  - benchmarking
  - comparative analysis
  - PCA
tools:
  - "comparative_analysis":
      description: |
        Pipeline script (bin/comparative_analysis.py) built on pandas, scikit-learn and plotly.
        Container: frozen Seqera Wave community image built from environment.yml
        (community.wave.seqera.io/library/python_pandas_scikit-learn_plotly_pruned:afa623fee18ad8e0).
      homepage: https://github.com/FOI-Bioinformatics/taxbencher
      documentation: https://github.com/FOI-Bioinformatics/taxbencher/blob/main/docs/output.md
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', sample_id:'sample1', labels:'sample1_kraken2,sample1_metaphlan', num_classifiers:2 ]`
    - opal_dir:
        type: directory
        description: OPAL results directory containing results.tsv (long format) and evaluation data
        pattern: "*/"
    - bioboxes:
        type: file
        description: CAMI profiles of the evaluated classifiers, in the same order as meta.labels (optional, [] to skip the per-taxon comparison)
        pattern: "*.bioboxes"
        ontologies: []
  - gold_standard:
      type: file
      description: Gold standard CAMI profile of the sample
      pattern: "*.bioboxes"
      ontologies: []
output:
  pca_plot:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', sample_id:'sample1', labels:'sample1_kraken2,sample1_metaphlan', num_classifiers:2 ]`
      - "*_pca.html":
          type: file
          description: Interactive PCA of the classifiers over all metric/rank features
          pattern: "*_pca.html"
          ontologies:
            - edam: http://edamontology.org/format_2331 # HTML
  diff_taxa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', sample_id:'sample1', labels:'sample1_kraken2,sample1_metaphlan', num_classifiers:2 ]`
      - "*_diff_taxa.tsv":
          type: file
          description: Per-taxon observed vs expected abundance with absolute/log2 difference and TP/FP/FN status per classifier and rank
          pattern: "*_diff_taxa.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  comparison_report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', sample_id:'sample1', labels:'sample1_kraken2,sample1_metaphlan', num_classifiers:2 ]`
      - "*_comparison.html":
          type: file
          description: HTML report with the classifier comparison of this sample
          pattern: "*_comparison.html"
          ontologies:
            - edam: http://edamontology.org/format_2331 # HTML
  metrics_wide:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', sample_id:'sample1', labels:'sample1_kraken2,sample1_metaphlan', num_classifiers:2 ]`
      - "*_metrics_wide.tsv":
          type: file
          description: OPAL metrics pivoted to one row per tool and rank (with a sample column)
          pattern: "*_metrics_wide.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  multiqc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', sample_id:'sample1', labels:'sample1_kraken2,sample1_metaphlan', num_classifiers:2 ]`
      - "*_mqc.tsv":
          type: file
          description: MultiQC custom-content table with key OPAL metrics per classifier
          pattern: "*_mqc.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of the tool
  versions_comparative_analysis:
    - - ${task.process}:
          type: string
          description: The name of the process
      - comparative_analysis:
          type: string
          description: The name of the tool
      - comparative_analysis.py --version | sed "s/comparative_analysis.py //":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - comparative_analysis:
          type: string
          description: The name of the tool
      - comparative_analysis.py --version | sed "s/comparative_analysis.py //":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@andreassjodin"
maintainers:
  - "@andreassjodin"
containers:
  # Frozen Seqera Wave community images built from environment.yml (linux/amd64 only)
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_pandas_scikit-learn_plotly_pruned:afa623fee18ad8e0
      build_id: bd-afa623fee18ad8e0_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/python_pandas_scikit-learn_plotly_pruned:24c8063ae8d7b157
      build_id: bd-24c8063ae8d7b157_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/e0/e04b00d88399791cdd132f05867b1ade1dc3966a71153eb0f40b60c0185d7e7d/data
