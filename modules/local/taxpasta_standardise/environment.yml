# pandas/numpy are pinned to the versions inside the biocontainer
# (quay.io/biocontainers/taxpasta:0.7.0--pyhdfd78af_0): taxpasta 0.7.0 does not
# constrain pandas, and with pandas >= 3 its pandera schemas reject MetaPhlAn
# (empty `additional_species` column) and KMCP profiles.
name: taxpasta_standardise
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.12
  - bioconda::taxpasta=0.7.0
  - conda-forge::pandas=2.2.2
  - conda-forge::numpy=1.26.4
