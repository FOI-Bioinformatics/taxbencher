# Tool configuration for the Python scripts in bin/ and their unit tests (not a package).

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["modules/nf-core", "subworkflows/nf-core"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, bugbear
select = ["E", "F", "W", "B"]
# long lines are common in help texts and test fixtures
ignore = ["E501", "B905"]  # B905: zip() without strict= is intended (equal-length lists)

[tool.ruff.lint.per-file-ignores]
# the scripts put bin/ on sys.path before importing the shared taxonomy helpers
"bin/*.py" = ["E402"]
